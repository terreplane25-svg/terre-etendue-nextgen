<text x="470.0" y="447.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">ils laissent passer le niveau</text>
<text x="470.0" y="466.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">moyen, pas les vagues</text>
