<text x="470.0" y="349.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">tube PVC de 75 a 100 mm,</text>
<text x="470.0" y="368.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">solidaire de la perche</text>
