<text x="48.0" y="376.0" fill="#3B8FD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">clapot libre  ±100 mm</text>
<text x="48.0" y="395.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">la ligne d'eau y est</text>
<text x="48.0" y="412.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">indeterminee</text>
<text x="48.0" y="556.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">tout se mesure</text>
<text x="48.0" y="573.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">DEPUIS la ligne d'eau,</text>
<text x="48.0" y="590.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">jamais depuis le fond</text>
