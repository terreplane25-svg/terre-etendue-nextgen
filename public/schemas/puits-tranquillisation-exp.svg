<text x="806.0" y="218.0" fill="#c9d4e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400">avec puits ·  5,9 mm · S/B 2,9</text>
<text x="806.0" y="238.0" fill="#3D9E7C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">+ 10 seances ·  1,9 mm · S/B 10,5</text>
