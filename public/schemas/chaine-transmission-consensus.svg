<text x="556.0" y="726.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">ce trait</text>
<text x="28.0" y="818.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">Le texte qu'Ibn Taymiyyah rapporte descend de la colonne de gauche. Aucun de ses maillons</text>
<text x="28.0" y="838.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">n'est un mujtahid de la Loi — ce que la définition de l'ijmāʿ exige. La colonne de droite,</text>
<text x="28.0" y="858.0" fill="#7b8a9c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">elle, est indépendante : elle ne cite jamais la gauche, et elle la précède.</text>
